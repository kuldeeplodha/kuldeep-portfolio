name: Generate VR Baselines

# One-shot workflow to generate Playwright screenshot baselines inside the
# official Playwright Docker image and commit them back to a fixed target
# branch automatically.
#
# ADR-005 Q1: baselines are CI/Linux-authoritative — NEVER generate from a mac
# local run.
#
# Uses a push trigger on a disposable branch pattern rather than
# workflow_dispatch, so no separate API-side registration step is needed. The
# job always checks out and pushes back to TARGET_BRANCH below, regardless of
# which branch's push actually fired it.
#
# Usage:
#   1. Push any commit to a branch matching 'bootstrap-vr-trigger/**'.
#   2. Wait for the run to complete (~2 min).
#   3. The committed PNGs will appear in e2e/__screenshots__/ on TARGET_BRANCH.
#   4. The `visual` job in ci.yml will pass on TARGET_BRANCH's next run.
#   5. Delete the disposable trigger branch once done.

on:
  push:
    branches:
      - 'bootstrap-vr-trigger/**'

env:
  TARGET_BRANCH: feat/visual-regression-ws2

permissions:
  contents: write # needed to push the baseline commit back to TARGET_BRANCH

jobs:
  generate-baselines:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy

    steps:
      - uses: actions/checkout@v4
        with:
          # Always operate on the fixed target branch, not whatever branch's
          # push triggered this run.
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Generate visual regression baselines
        run: npm run test:e2e:update-visual
        env:
          VITE_BASE_PATH: /
          VITE_ADMIN_PASSWORD_HASH: ${{ secrets.VITE_ADMIN_PASSWORD_HASH }}

      - name: Commit and push baselines
        env:
          COMMIT_BODY: |
            Auto-generated by the 'Generate VR Baselines' workflow.
            Container: mcr.microsoft.com/playwright:v1.62.1-jammy
            Branch: ${{ env.TARGET_BRANCH }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__/
          # Only commit if there are new/changed baseline PNGs
          if git diff --cached --quiet; then
            echo "No baseline changes — nothing to commit."
          else
            COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -m "test(visual): generate VR baselines in Docker/Linux CI [${COUNT} PNGs]" -m "$COMMIT_BODY"
            git push origin HEAD:${{ env.TARGET_BRANCH }}
            echo "Pushed ${COUNT} baseline PNG(s) to ${{ env.TARGET_BRANCH }}."
          fi
