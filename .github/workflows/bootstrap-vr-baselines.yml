name: Generate VR Baselines

# One-shot workflow: manually dispatch on feat/visual-regression-ws2 (or any branch)
# to generate Playwright screenshot baselines inside the official Playwright Docker image
# and commit them back to the branch automatically.
#
# ADR-005 Q1: baselines are CI/Linux-authoritative — NEVER generate from a mac local run.
#
# Usage:
#   1. Go to Actions → "Generate VR Baselines" → Run workflow → select the branch.
#   2. Wait for the run to complete (~2 min).
#   3. The committed PNGs will appear in e2e/__screenshots__/ on the branch.
#   4. The `visual` job in ci.yml will pass on the next push/PR run.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to generate baselines on (defaults to current branch)'
        required: false
        default: ''

permissions:
  contents: write   # needed to push the baseline commit back to the branch

jobs:
  generate-baselines:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-jammy

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch that triggered the dispatch (or the input override).
          ref: ${{ github.head_ref || github.ref_name }}
          # Use a token with write access so the push step works.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Generate visual regression baselines
        run: npm run test:e2e:update-visual
        env:
          VITE_BASE_PATH: /
          VITE_ADMIN_PASSWORD_HASH: ${{ secrets.VITE_ADMIN_PASSWORD_HASH }}

      - name: Commit and push baselines
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__/
          # Only commit if there are new/changed baseline PNGs
          if git diff --cached --quiet; then
            echo "No baseline changes — nothing to commit."
          else
            COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -m "test(visual): generate VR baselines in Docker/Linux CI [${COUNT} PNGs]

Auto-generated by the 'Generate VR Baselines' workflow.
Container: mcr.microsoft.com/playwright:v1.49.1-jammy
Branch: ${{ github.ref_name }}

Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>
Claude-Session: https://claude.ai/code/session_01X532keiScMQ45KLHjNkBJo"
            git push
            echo "Pushed ${COUNT} baseline PNG(s) to ${{ github.ref_name }}."
          fi
