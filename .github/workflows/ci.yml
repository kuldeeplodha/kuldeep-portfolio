name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Runs unit/component suites AND enforces the coverage floor
      # (thresholds in vite.config.ts; fails the build below the floor).
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          VITE_BASE_PATH: /
      # Aggregate axe results into the GitHub Actions job summary
      - name: Generate a11y report summary
        if: always()
        run: node scripts/a11y-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      # Upload raw axe JSON results as a downloadable CI artifact
      - name: Upload a11y JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results
          path: test-results/a11y/
          if-no-files-found: warn
      - run: npm run build

  # Visual regression runs in parallel with `verify`, inside the official
  # Playwright container so baselines match the committed Linux PNGs exactly.
  # On failure, diff images are uploaded so reviewers can inspect regressions.
  #
  # Bootstrap note: on the very first run after baseline PNGs are committed,
  # this job will pass. Until then (no committed baselines) the job will fail
  # with "snapshot missing" — generate baselines via:
  #   docker run --rm -v $(pwd):/work -w /work \
  #     mcr.microsoft.com/playwright:v$(node -p "require('@playwright/test/package.json').version")-jammy \
  #     npm run test:e2e:update-visual
  # then commit e2e/__screenshots__/**/*.png and push.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run visual regression tests
        run: npm run test:e2e:visual
        env:
          VITE_BASE_PATH: /
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7
