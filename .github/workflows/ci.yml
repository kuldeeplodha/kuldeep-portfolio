name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          VITE_BASE_PATH: /
      # Aggregate axe results into the GitHub Actions job summary
      - name: Generate a11y report summary
        if: always()
        run: node scripts/a11y-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      # Upload raw axe JSON results as a downloadable CI artifact
      - name: Upload a11y JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results
          path: test-results/a11y/
          if-no-files-found: warn
      - run: npm run build
