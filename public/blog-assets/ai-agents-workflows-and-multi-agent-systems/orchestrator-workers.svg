<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(40, 100)">
    <path d="M 120 100 L 220 100" fill="none" stroke="#4facfe" stroke-width="2" />
    
    <!-- Orchestrator to Workers -->
    <path d="M 360 100 L 450 40" fill="none" stroke="#4facfe" stroke-width="2" stroke-dasharray="5,5" />
    <path d="M 360 100 L 450 100" fill="none" stroke="#4facfe" stroke-width="2" stroke-dasharray="5,5" />
    <path d="M 360 100 L 450 160" fill="none" stroke="#4facfe" stroke-width="2" stroke-dasharray="5,5" />
    
    <!-- Workers to Orchestrator (Synthesis) -->
    <path d="M 590 40 L 680 100" fill="none" stroke="#4facfe" stroke-width="2" stroke-dasharray="5,5" />
    <path d="M 590 100 L 680 100" fill="none" stroke="#4facfe" stroke-width="2" stroke-dasharray="5,5" />
    <path d="M 590 160 L 680 100" fill="none" stroke="#4facfe" stroke-width="2" stroke-dasharray="5,5" />

    <rect x="0" y="80" width="120" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="60" y="105" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">User Task</text>

    <rect x="220" y="70" width="140" height="60" rx="4" fill="#222" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <text x="290" y="100" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Orchestrator</text>
    <text x="290" y="120" fill="#999" font-size="12" text-anchor="middle">(Plan)</text>

    <rect x="450" y="20" width="140" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="520" y="45" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Worker A</text>

    <rect x="450" y="80" width="140" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="520" y="105" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Worker B</text>

    <rect x="450" y="140" width="140" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="520" y="165" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Worker C</text>

    <rect x="680" y="70" width="140" height="60" rx="4" fill="#222" stroke="#4facfe" stroke-width="2" filter="url(#glow)"/>
    <text x="750" y="100" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Orchestrator</text>
    <text x="750" y="120" fill="#999" font-size="12" text-anchor="middle">(Synthesize)</text>
  </g>

</svg>