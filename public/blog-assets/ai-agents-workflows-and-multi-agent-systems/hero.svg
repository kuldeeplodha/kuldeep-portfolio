<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(100, 150)">
    <!-- Path -->
    <path d="M 100 50 L 500 50" fill="none" stroke="url(#glowCyan)" stroke-width="4" opacity="0.7" />
    
    <!-- Nodes -->
    <rect x="0" y="10" width="140" height="80" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="70" y="50" fill="#e0e0e0" font-size="18" font-weight="600" text-anchor="middle">Workflow</text>
    <text x="70" y="70" fill="#999" font-size="12" text-anchor="middle">Deterministic</text>
    
    <rect x="230" y="10" width="140" height="80" rx="4" fill="#222" stroke="#4facfe" stroke-width="2" filter="url(#glow)"/>
    <text x="300" y="50" fill="#e0e0e0" font-size="18" font-weight="600" text-anchor="middle">Agent</text>
    <text x="300" y="70" fill="#999" font-size="12" text-anchor="middle">Autonomous</text>

    <rect x="460" y="10" width="140" height="80" rx="4" fill="#222" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <text x="530" y="50" fill="#e0e0e0" font-size="18" font-weight="600" text-anchor="middle">Multi-Agent</text>
    <text x="530" y="70" fill="#999" font-size="12" text-anchor="middle">Collaborative</text>

    <!-- Title -->
    <text x="300" y="-50" fill="#4facfe" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="2">THE AUTONOMY SPECTRUM</text>
  </g>

</svg>