<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(130, 60)">
    <!-- Main stem -->
    <path d="M 320 40 L 320 80" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 320 120 L 320 160" fill="none" stroke="#4facfe" stroke-width="2" />
    
    <!-- Split 1 -->
    <path d="M 320 160 L 160 160 M 160 160 L 160 200" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 320 160 L 480 160 M 480 160 L 480 200" fill="none" stroke="#4facfe" stroke-width="2" />
    
    <!-- Split 2 from NO -->
    <path d="M 480 240 L 480 280 M 480 280 L 320 280 M 320 280 L 320 320" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 480 280 L 640 280 M 640 280 L 640 320" fill="none" stroke="#4facfe" stroke-width="2" />

    <rect x="220" y="0" width="200" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="320" y="25" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">New LLM Feature</text>

    <rect x="200" y="80" width="240" height="40" rx="4" fill="#222" stroke="#00f2fe" stroke-width="2"/>
    <text x="320" y="105" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Are steps known/fixed?</text>

    <text x="240" y="150" fill="#4facfe" font-size="14" font-weight="600" text-anchor="middle">YES</text>
    <text x="400" y="150" fill="#4facfe" font-size="14" font-weight="600" text-anchor="middle">NO</text>

    <!-- YES path -> WORKFLOW -->
    <rect x="60" y="200" width="200" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="160" y="230" fill="#e0e0e0" font-size="16" font-weight="700" text-anchor="middle">WORKFLOW</text>
    <text x="160" y="250" fill="#999" font-size="12" text-anchor="middle">(chain, route, parallel)</text>

    <!-- NO path -> dynamic tool choice? -->
    <rect x="380" y="200" width="200" height="40" rx="4" fill="#222" stroke="#4facfe" stroke-width="2"/>
    <text x="480" y="225" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Need dynamic tools?</text>

    <text x="400" y="270" fill="#4facfe" font-size="14" font-weight="600" text-anchor="middle">YES</text>
    <text x="560" y="270" fill="#4facfe" font-size="14" font-weight="600" text-anchor="middle">NO</text>

    <!-- YES path -> SINGLE AGENT -->
    <rect x="220" y="320" width="200" height="50" rx="4" fill="#222" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <text x="320" y="350" fill="#e0e0e0" font-size="16" font-weight="700" text-anchor="middle">SINGLE AGENT</text>

    <!-- NO path -> RAG + One LLM Call -->
    <rect x="540" y="320" width="200" height="50" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="640" y="350" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">RAG + One LLM Call</text>

    <!-- Add MULTI-AGENT branch if Single Agent is insufficient -->
    <path d="M 320 370 L 320 400" fill="none" stroke="#4facfe" stroke-width="2" />
    <text x="375" y="390" fill="#999" font-size="12" text-anchor="middle">If insufficient</text>
    <rect x="220" y="400" width="200" height="40" rx="4" fill="#222" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <text x="320" y="425" fill="#e0e0e0" font-size="16" font-weight="700" text-anchor="middle">MULTI-AGENT SYSTEM</text>
  </g>

</svg>