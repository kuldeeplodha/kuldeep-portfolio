<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(150, 50)">
    <path d="M 250 40 L 250 80" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 250 120 L 250 160" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 250 160 L 100 160 M 100 160 L 100 200" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 250 160 L 400 160 M 400 160 L 400 200" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 400 240 L 400 280 M 400 280 L 250 280 M 250 280 L 250 320" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 400 280 L 550 280 M 550 280 L 550 320" fill="none" stroke="#4facfe" stroke-width="2" />

    <rect x="150" y="0" width="200" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="250" y="25" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">New LLM Feature</text>

    <rect x="150" y="80" width="200" height="40" rx="4" fill="#222" stroke="#00f2fe" stroke-width="2"/>
    <text x="250" y="105" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Are steps known/fixed?</text>

    <text x="150" y="150" fill="#4facfe" font-size="12" font-weight="600" text-anchor="middle">YES</text>
    <text x="350" y="150" fill="#4facfe" font-size="12" font-weight="600" text-anchor="middle">NO</text>

    <rect x="0" y="200" width="200" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="100" y="230" fill="#e0e0e0" font-size="16" font-weight="700" text-anchor="middle">WORKFLOW</text>
    <text x="100" y="250" fill="#999" font-size="10" text-anchor="middle">(chain, route, parallel)</text>

    <rect x="300" y="200" width="200" height="40" rx="4" fill="#222" stroke="#4facfe" stroke-width="2"/>
    <text x="400" y="225" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Need dynamic tools?</text>

    <text x="300" y="270" fill="#4facfe" font-size="12" font-weight="600" text-anchor="middle">YES</text>
    <text x="500" y="270" fill="#4facfe" font-size="12" font-weight="600" text-anchor="middle">NO</text>

    <rect x="150" y="320" width="200" height="40" rx="4" fill="#222" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <text x="250" y="345" fill="#e0e0e0" font-size="16" font-weight="700" text-anchor="middle">SINGLE AGENT</text>

    <rect x="450" y="320" width="200" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="550" y="345" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">RAG + One LLM Call</text>
  </g>

</svg>