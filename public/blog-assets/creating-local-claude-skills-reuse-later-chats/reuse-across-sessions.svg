<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title">
  <title id="title">Diagram: how personal vs project skills persist across sessions</title>
  <rect width="720" height="280" fill="#1a1d23"/>
  <text x="36" y="40" fill="#e8eaed" font-family="ui-sans-serif,sans-serif" font-size="15" font-weight="600">Reuse across later chats</text>
  <rect x="36" y="64" width="200" height="72" rx="6" fill="#252b36" stroke="#4a9eff" stroke-width="1"/>
  <text x="52" y="92" fill="#8ab4f8" font-size="13" font-family="ui-sans-serif,sans-serif">~/.claude/skills/</text>
  <text x="52" y="114" fill="#9aa0a6" font-size="11" font-family="ui-sans-serif,sans-serif">Every new session</text>
  <text x="52" y="128" fill="#9aa0a6" font-size="11" font-family="ui-sans-serif,sans-serif">on your machine</text>
  <path d="M248 100 H300" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="300" y="64" width="160" height="72" rx="6" fill="#252b36" stroke="#3d4f66"/>
  <text x="316" y="100" fill="#e8eaed" font-size="12" font-family="ui-sans-serif,sans-serif">Session A</text>
  <text x="316" y="118" fill="#e8eaed" font-size="12" font-family="ui-sans-serif,sans-serif">Session B ...</text>
  <rect x="500" y="64" width="184" height="72" rx="6" fill="#252b36" stroke="#3d4f66"/>
  <text x="516" y="92" fill="#8ab4f8" font-size="13" font-family="ui-sans-serif,sans-serif">.claude/skills/</text>
  <text x="516" y="114" fill="#9aa0a6" font-size="11" font-family="ui-sans-serif,sans-serif">Git -&gt; teammates</text>
  <text x="516" y="128" fill="#9aa0a6" font-size="11" font-family="ui-sans-serif,sans-serif">+ cloud sessions*</text>
  <text x="36" y="180" fill="#9aa0a6" font-size="11" font-family="ui-sans-serif,sans-serif">* Cowork/cloud: project skills in repo; personal ~/.claude not on remote - see official docs.</text>
  <text x="36" y="248" fill="#6b7280" font-size="11" font-family="ui-sans-serif,sans-serif">Diagram (not Anthropic UI). Based on code.claude.com/docs/en/skills</text>
  <defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4a9eff"/></marker></defs>
</svg>
