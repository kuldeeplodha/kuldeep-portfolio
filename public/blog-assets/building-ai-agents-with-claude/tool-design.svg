<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="200" height="80" rx="4" fill="#222" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <text x="100" y="30" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Input Schema</text>
    <text x="100" y="55" fill="#999" font-size="12" text-anchor="middle">Strict typing &amp; validation</text>

    <rect x="250" y="0" width="200" height="80" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="350" y="30" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Idempotent Exec</text>
    <text x="350" y="55" fill="#999" font-size="12" text-anchor="middle">Safe retries without dupes</text>

    <rect x="500" y="0" width="200" height="80" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="600" y="30" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Explicit Errors</text>
    <text x="600" y="55" fill="#999" font-size="12" text-anchor="middle">Actionable codes for LLM</text>
    
    <path d="M 200 40 L 250 40" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 450 40 L 500 40" fill="none" stroke="#4facfe" stroke-width="2" />
  </g>

</svg>