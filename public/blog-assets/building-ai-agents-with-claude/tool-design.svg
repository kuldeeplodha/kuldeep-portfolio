<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(90, 150)">
    <rect x="0" y="0" width="220" height="100" rx="6" fill="#222" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <text x="110" y="45" fill="#e0e0e0" font-size="18" font-weight="600" text-anchor="middle">Input Schema</text>
    <text x="110" y="70" fill="#999" font-size="14" text-anchor="middle">Strict typing &amp; validation</text>

    <rect x="260" y="0" width="220" height="100" rx="6" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="370" y="45" fill="#e0e0e0" font-size="18" font-weight="600" text-anchor="middle">Idempotent Exec</text>
    <text x="370" y="70" fill="#999" font-size="14" text-anchor="middle">Safe retries without dupes</text>

    <rect x="520" y="0" width="220" height="100" rx="6" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="630" y="45" fill="#e0e0e0" font-size="18" font-weight="600" text-anchor="middle">Explicit Errors</text>
    <text x="630" y="70" fill="#999" font-size="14" text-anchor="middle">Actionable codes for LLM</text>
    
    <path d="M 220 50 L 260 50" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 480 50 L 520 50" fill="none" stroke="#4facfe" stroke-width="2" />
  </g>

</svg>