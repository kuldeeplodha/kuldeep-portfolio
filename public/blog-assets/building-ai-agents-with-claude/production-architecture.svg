<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(50, 50)">
    <path d="M 350 40 L 350 80" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 120 110 L 210 110" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 330 110 L 410 110" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 530 110 L 610 110" fill="none" stroke="#4facfe" stroke-width="2" />
    
    <path d="M 60 140 L 60 210" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 60 210 L 350 210 M 350 210 L 350 240 M 150 210 L 150 240 M 550 210 L 550 240" fill="none" stroke="#4facfe" stroke-width="2" />

    <rect x="250" y="0" width="200" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="350" y="25" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">API Gateway / Auth</text>

    <rect x="0" y="80" width="120" height="60" rx="4" fill="#222" stroke="#4facfe" stroke-width="2" filter="url(#glow)"/>
    <text x="60" y="110" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Agent Runtime</text>
    <text x="60" y="130" fill="#999" font-size="10" text-anchor="middle">(state, loop)</text>

    <rect x="210" y="80" width="120" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="270" y="110" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Policy Engine</text>
    <text x="270" y="130" fill="#999" font-size="10" text-anchor="middle">(permissions)</text>

    <rect x="410" y="80" width="120" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="470" y="110" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Tool Executor</text>
    <text x="470" y="130" fill="#999" font-size="10" text-anchor="middle">(sandboxed)</text>

    <rect x="610" y="80" width="120" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="670" y="110" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Approval Queue</text>
    <text x="670" y="130" fill="#999" font-size="10" text-anchor="middle">(HITL)</text>

    <rect x="90" y="240" width="120" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="150" y="270" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Trace / Log Store</text>

    <rect x="290" y="240" width="120" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="350" y="270" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Secrets Manager</text>

    <rect x="490" y="240" width="120" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="550" y="270" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Rate limits</text>
  </g>

</svg>