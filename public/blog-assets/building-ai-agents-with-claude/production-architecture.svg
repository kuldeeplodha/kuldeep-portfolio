<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(60, 80)">
    <!-- API Gateway down to Agent Runtime -->
    <path d="M 390 40 L 390 80" fill="none" stroke="#4facfe" stroke-width="2" />
    <!-- Horizontal links between upper components -->
    <path d="M 160 110 L 250 110" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 390 110 L 480 110" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 620 110 L 710 110" fill="none" stroke="#4facfe" stroke-width="2" />
    
    <!-- Vertical link down from Agent Runtime to the bus -->
    <path d="M 90 140 L 90 180" fill="none" stroke="#4facfe" stroke-width="2" />
    
    <!-- The horizontal bus for bottom nodes (y=180) -->
    <path d="M 90 180 L 550 180" fill="none" stroke="#4facfe" stroke-width="2" />
    
    <!-- Downlinks from bus to bottom nodes -->
    <path d="M 90 180 L 90 220" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 320 180 L 320 220" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 550 180 L 550 220" fill="none" stroke="#4facfe" stroke-width="2" />
    
    <!-- API Gateway -->
    <rect x="290" y="0" width="200" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="390" y="25" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">API Gateway / Auth</text>

    <!-- Top row -->
    <rect x="20" y="80" width="140" height="60" rx="4" fill="#222" stroke="#4facfe" stroke-width="2" filter="url(#glow)"/>
    <text x="90" y="110" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Agent Runtime</text>
    <text x="90" y="130" fill="#999" font-size="12" text-anchor="middle">(state, loop)</text>

    <rect x="250" y="80" width="140" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="320" y="110" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Policy Engine</text>
    <text x="320" y="130" fill="#999" font-size="12" text-anchor="middle">(permissions)</text>

    <rect x="480" y="80" width="140" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="550" y="110" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Tool Executor</text>
    <text x="550" y="130" fill="#999" font-size="12" text-anchor="middle">(sandboxed)</text>

    <rect x="710" y="80" width="140" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="780" y="110" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Approval Queue</text>
    <text x="780" y="130" fill="#999" font-size="12" text-anchor="middle">(HITL)</text>

    <!-- Bottom row -->
    <rect x="20" y="220" width="140" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="90" y="250" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Trace / Log Store</text>

    <rect x="250" y="220" width="140" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="320" y="250" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Secrets Manager</text>

    <rect x="480" y="220" width="140" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="550" y="250" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Rate limits</text>
  </g>

</svg>