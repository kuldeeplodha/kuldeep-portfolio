<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(150, 50)">
    <!-- Path -->
    <path d="M 250 50 L 250 300" fill="none" stroke="url(#glowCyan)" stroke-width="4" opacity="0.7" />
    
    <!-- Nodes -->
    <g transform="translate(100, 0)">
      <rect x="0" y="0" width="300" height="40" rx="4" fill="#222" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
      <text x="150" y="25" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Evals &amp; Guardrails</text>

      <rect x="0" y="55" width="300" height="40" rx="4" fill="#222" stroke="#4facfe" stroke-width="2"/>
      <text x="150" y="80" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Observability &amp; Tracing</text>

      <rect x="0" y="110" width="300" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
      <text x="150" y="135" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Memory (Short/Long-term)</text>

      <rect x="0" y="165" width="300" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
      <text x="150" y="190" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Tools &amp; APIs</text>

      <rect x="0" y="220" width="300" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
      <text x="150" y="245" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Context Management</text>

      <rect x="0" y="275" width="300" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
      <text x="150" y="300" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Agent Core (LLM)</text>
    </g>

    <!-- Title -->
    <text x="-50" y="170" fill="#4facfe" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="2" transform="rotate(-90 -50 170)">THE RELIABILITY STACK</text>
  </g>

</svg>