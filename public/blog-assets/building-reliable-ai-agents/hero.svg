<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(180, 50)">
    <!-- Path -->
    <path d="M 270 20 L 270 320" fill="none" stroke="url(#glowCyan)" stroke-width="4" opacity="0.7" />
    
    <!-- Nodes -->
    <g transform="translate(100, 0)">
      <rect x="0" y="0" width="340" height="40" rx="4" fill="#222" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
      <text x="170" y="25" fill="#e0e0e0" font-size="18" font-weight="600" text-anchor="middle">Evals &amp; Guardrails</text>

      <rect x="0" y="60" width="340" height="40" rx="4" fill="#222" stroke="#4facfe" stroke-width="2"/>
      <text x="170" y="85" fill="#e0e0e0" font-size="18" font-weight="600" text-anchor="middle">Observability &amp; Tracing</text>

      <rect x="0" y="120" width="340" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
      <text x="170" y="145" fill="#e0e0e0" font-size="18" font-weight="600" text-anchor="middle">Memory (Short/Long-term)</text>

      <rect x="0" y="180" width="340" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
      <text x="170" y="205" fill="#e0e0e0" font-size="18" font-weight="600" text-anchor="middle">Tools &amp; APIs</text>

      <rect x="0" y="240" width="340" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
      <text x="170" y="265" fill="#e0e0e0" font-size="18" font-weight="600" text-anchor="middle">Context Management</text>

      <rect x="0" y="300" width="340" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
      <text x="170" y="325" fill="#e0e0e0" font-size="18" font-weight="600" text-anchor="middle">Agent Core (LLM)</text>
    </g>

    <!-- Title -->
    <text x="-70" y="170" fill="#4facfe" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="3" transform="rotate(-90 -70 170)">THE RELIABILITY STACK</text>
  </g>

</svg>