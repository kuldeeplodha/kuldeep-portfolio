<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(70, 110)">
    <path d="M 160 40 L 200 40" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 360 40 L 400 40" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 560 40 L 600 40" fill="none" stroke="#4facfe" stroke-width="2" />
    
    <!-- Vertical and horizontal trace connections -->
    <path d="M 80 70 L 80 150" fill="none" stroke="#4facfe" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 80 150 L 280 150 M 280 150 L 280 180 M 480 150 L 480 180 M 80 150 L 480 150" fill="none" stroke="#4facfe" stroke-width="2" stroke-dasharray="4,4" />
    
    <rect x="0" y="10" width="160" height="60" rx="4" fill="#222" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <text x="80" y="45" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Agent Runtime</text>

    <rect x="200" y="10" width="160" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="280" y="45" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Context+Memory</text>

    <rect x="400" y="10" width="160" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="480" y="35" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Tool Exec</text>
    <text x="480" y="55" fill="#999" font-size="12" text-anchor="middle">(+ idempotency)</text>

    <rect x="600" y="10" width="160" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="680" y="45" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Approval Queue</text>

    <rect x="0" y="180" width="160" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="80" y="215" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Trace Store</text>

    <rect x="200" y="180" width="160" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="280" y="215" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Eval Pipeline</text>

    <rect x="400" y="180" width="160" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="480" y="215" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Metrics+Alerts</text>
  </g>

</svg>