<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(100, 80)">
    <path d="M 120 40 L 160 40" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 280 40 L 320 40" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 440 40 L 480 40" fill="none" stroke="#4facfe" stroke-width="2" />
    
    <path d="M 60 70 L 60 140" fill="none" stroke="#4facfe" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 60 140 L 220 140 M 220 140 L 220 170 M 380 140 L 380 170 M 60 140 L 380 140" fill="none" stroke="#4facfe" stroke-width="2" stroke-dasharray="4,4" />
    
    <rect x="0" y="10" width="120" height="60" rx="4" fill="#222" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <text x="60" y="45" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Agent Runtime</text>

    <rect x="160" y="10" width="120" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="220" y="45" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Context+Memory</text>

    <rect x="320" y="10" width="120" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="380" y="35" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Tool Exec</text>
    <text x="380" y="55" fill="#999" font-size="10" text-anchor="middle">(+ idempotency)</text>

    <rect x="480" y="10" width="120" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="540" y="45" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Approval Queue</text>

    <rect x="0" y="170" width="120" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="60" y="205" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Trace Store</text>

    <rect x="160" y="170" width="120" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="220" y="205" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Eval Pipeline</text>

    <rect x="320" y="170" width="120" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="380" y="205" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Metrics+Alerts</text>
  </g>

</svg>