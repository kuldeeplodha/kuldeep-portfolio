<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="700" height="180" rx="8" fill="#1a1a1a" stroke="#4facfe" stroke-width="2" filter="url(#glow)"/>
    <rect x="0" y="0" width="700" height="50" fill="#222" />
    <text x="20" y="32" fill="#00f2fe" font-size="18" font-weight="600">Trace: request_a1b2c3</text>
    
    <text x="20" y="85" fill="#999" font-size="14">model:</text>
    <text x="75" y="85" fill="#e0e0e0" font-size="14" font-weight="600">claude-sonnet-5</text>

    <text x="250" y="85" fill="#999" font-size="14">tool_name:</text>
    <text x="335" y="85" fill="#e0e0e0" font-size="14" font-weight="600">search_issues</text>
    
    <text x="490" y="85" fill="#999" font-size="14">latency_ms:</text>
    <text x="575" y="85" fill="#e0e0e0" font-size="14" font-weight="600">1420</text>

    <text x="20" y="120" fill="#999" font-size="14">tokens_in:</text>
    <text x="95" y="120" fill="#e0e0e0" font-size="14" font-weight="600">4510</text>

    <text x="250" y="120" fill="#999" font-size="14">status:</text>
    <text x="305" y="120" fill="#4ade80" font-size="14" font-weight="600">OK</text>
    
    <text x="490" y="120" fill="#999" font-size="14">human_intervention:</text>
    <text x="635" y="120" fill="#e0e0e0" font-size="14" font-weight="600">false</text>

    <text x="20" y="155" fill="#999" font-size="14">tool_args_redacted:</text>
    <text x="165" y="155" fill="#e0e0e0" font-size="14" font-weight="600">{"query": "auth bug", "project": "***"}</text>
  </g>

</svg>