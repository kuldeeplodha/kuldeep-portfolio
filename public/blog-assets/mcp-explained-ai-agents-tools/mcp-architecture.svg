<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(200, 80)">
    <rect x="0" y="0" width="400" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="200" y="25" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">App Layer</text>
    <text x="200" y="45" fill="#999" font-size="12" text-anchor="middle">Agent loop, prompts, observability</text>

    <rect x="0" y="80" width="400" height="60" rx="4" fill="#222" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <text x="200" y="105" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">MCP Data Layer (JSON-RPC)</text>
    <text x="200" y="125" fill="#999" font-size="12" text-anchor="middle">tools, resources, prompts, discovery</text>

    <rect x="0" y="160" width="400" height="60" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="200" y="185" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Transport Layer</text>
    <text x="200" y="205" fill="#999" font-size="12" text-anchor="middle">stdio | Streamable HTTP</text>
    
    <path d="M 200 60 L 200 80" fill="none" stroke="#4facfe" stroke-width="2" stroke-dasharray="3,3" />
    <path d="M 200 140 L 200 160" fill="none" stroke="#4facfe" stroke-width="2" stroke-dasharray="3,3" />
  </g>

</svg>