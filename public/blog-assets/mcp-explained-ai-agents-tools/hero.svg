<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(80, 150)">
    <!-- Path -->
    <path d="M 100 50 L 550 50" fill="none" stroke="#444" stroke-width="2" />
    
    <!-- Nodes -->
    <rect x="0" y="20" width="120" height="60" rx="8" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="60" y="55" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">AI App</text>
    
    <rect x="170" y="20" width="120" height="60" rx="8" fill="#222" stroke="#4facfe" stroke-width="2" filter="url(#glow)"/>
    <text x="230" y="55" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">MCP Client</text>

    <rect x="340" y="20" width="130" height="60" rx="8" fill="#222" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <text x="405" y="55" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">MCP Servers</text>

    <rect x="520" y="0" width="120" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="580" y="25" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Tools</text>

    <rect x="520" y="60" width="120" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="580" y="85" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Resources</text>

    <!-- Title -->
    <text x="320" y="-50" fill="#4facfe" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="2">MODEL CONTEXT PROTOCOL</text>
  </g>

</svg>