<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background-color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a1a" />
  <rect width="100%" height="100%" fill="url(#grid)" />


  <g transform="translate(100, 50)">
    <path d="M 300 30 L 300 250" fill="none" stroke="#4facfe" stroke-width="2" opacity="0.3" />

    <rect x="150" y="0" width="300" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="300" y="25" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Host starts &amp; Client connects</text>

    <rect x="150" y="70" width="300" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="300" y="95" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">initialize / initialized handshake</text>

    <rect x="150" y="140" width="300" height="40" rx="4" fill="#222" stroke="#4facfe" stroke-width="2"/>
    <text x="300" y="165" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">tools/list, resources/list</text>

    <rect x="150" y="210" width="300" height="40" rx="4" fill="#222" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <text x="300" y="235" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Host registers unified tools</text>

    <rect x="150" y="280" width="300" height="40" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
    <text x="300" y="305" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Agent loop uses merged tools</text>

    <path d="M 300 40 L 300 70" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 300 110 L 300 140" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 300 180 L 300 210" fill="none" stroke="#4facfe" stroke-width="2" />
    <path d="M 300 250 L 300 280" fill="none" stroke="#4facfe" stroke-width="2" />
  </g>

</svg>